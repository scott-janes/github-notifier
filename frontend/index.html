<!DOCTYPE html>
<html lang="en" class="bg-transparent">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>GitHub Notifications</title>
  <style>[x-cloak]{display:none!important}</style>
  <link rel="stylesheet" href="/src/style.css"/>
</head>
<body class="bg-transparent m-0 p-0 overflow-hidden select-none">
  <div id="app">
    <div x-data="app" class="relative w-full h-full">

      <!-- Floating Dot -->
      <div
        x-show="!expanded"
        @mousedown="handleDotMousedown"
        @mouseup="handleDotMouseup"
        class="absolute top-0 right-0 w-[60px] h-[60px] z-40 cursor-pointer flex items-center justify-center"
        :class="{ 'drag-handle': cmdHeld && !disableDrag }"
      >
        <div
          class="w-11 h-11 rounded-full flex items-center justify-center transition-all duration-200 relative"
          :class="pollingActive ? 'bg-white/30' : (dndActive ? 'bg-indigo-500/40' : (unconfirmedCount > 0 ? (pulseActive ? 'bg-dot dot-pulse' : 'bg-dot') : 'bg-white/15 hover:bg-white/25'))"
        >
          <!-- Spinner during polling -->
          <svg x-show="pollingActive" class="animate-spin w-5 h-5 text-white/80" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <!-- Moon icon during DND -->
          <svg x-show="dndActive && !pollingActive" class="w-5 h-5 text-indigo-200/70" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
          </svg>
          <svg x-show="!dndActive && !pollingActive && unconfirmedCount === 0" class="w-5 h-5 text-white/70" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/>
          </svg>
          <svg x-show="!dndActive && !pollingActive && unconfirmedCount > 0" class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/>
          </svg>
          <span
            v-show="unconfirmedCount > 0"
            class="badge-pop absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center leading-none shadow-lg"
            x-text="unconfirmedCount"
          ></span>
        </div>
      </div>

      <!-- Notification Toast -->
      <div
        x-show="toastVisible" x-cloak
        class="absolute top-[64px] right-1 z-50 w-[340px]"
        :class="{ 'toast-print': toastAnimating, 'toast-retract': toastRetracting }"
        @mouseenter="pauseToastTimer" @mouseleave="resumeToastTimer"
      >
        <div class="rounded-b-2xl rounded-t-sm overflow-hidden" style="background: rgba(var(--theme-bg), 0.96); backdrop-filter: blur(20px);">
          <div class="h-[3px] bg-gradient-to-r from-[var(--theme-accent)]/60 via-[var(--theme-accent-400)]/40 to-transparent"></div>
          <template x-for="(n, idx) in toastNotifications" :key="n.id">
            <div class="px-4 py-3" :class="{ 'border-t border-white/5': idx > 0 }">
              <div class="flex items-start justify-between mb-1">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase tracking-wider"
                  :class="reasonClass(n.reason)" x-text="reasonLabel(n.reason)"
                ></span>
                <span class="text-[11px] text-white/30 whitespace-nowrap ml-2" x-text="timeAgo(n.updated_at)"></span>
              </div>
              <div class="text-sm font-medium text-white/90 leading-snug mb-0.5 pr-4" x-text="n.title"></div>
              <div class="text-xs text-white/40 mb-3" x-text="n.repo"></div>
              <div class="flex gap-2">
                <button @click="toastConfirm(n.id)" class="flex-1 py-1.5 px-3 rounded-lg bg-white/10 hover:bg-white/20 text-white/80 hover:text-white text-xs font-medium transition-all">Confirm</button>
                <button @click="toastOpen(n.url, n.id)" class="flex-1 py-1.5 px-3 rounded-lg bg-accent/20 hover:bg-accent/30 text-accent-400 hover:text-accent text-xs font-medium transition-all">Open</button>
              </div>
            </div>
          </template>
          <div class="relative px-4 py-2">
            <div class="text-[10px] text-white/20 text-center tracking-[0.2em]">
              <span x-text="toastQueue.length > 0 ? toastQueue.length + ' more in queue' : toastFooter"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Receipt panel (rendered only when expanded, never in DOM otherwise) -->
      <template x-if="expanded">
        <div class="absolute inset-0 flex flex-col overflow-hidden rounded-2xl shadow-2xl receipt-print"
          :style="'background: rgba(var(--theme-bg), ' + (config.panel_opacity || 0.95) + '); backdrop-filter: blur(20px);'"
          @mouseenter="cancelAutoHide" @mouseleave="startAutoHide"
        >
          <!-- Header -->
          <div class="flex items-center justify-between px-3 py-3 border-b border-white/5" :class="{ 'drag-handle': cmdHeld && !disableDrag }">
            <div class="flex items-center gap-1">
              <button @click="settingsOpen = !settingsOpen" style="--wails-draggable: no-drag" class="p-1 rounded-lg text-white/40 hover:text-white/80 transition-colors" :class="{ 'text-white/80': settingsOpen }">&#9881;</button>
              <button @click="closePanel" style="--wails-draggable: no-drag" class="p-1 rounded-lg text-white/30 hover:text-white/60 transition-colors text-sm leading-none">&#10005;</button>
              <button @click="toggleDND" style="--wails-draggable: no-drag" class="p-1 rounded-lg transition-colors text-sm" :class="dndActive ? 'text-indigo-400' : 'text-white/30 hover:text-white/60'">&#127769;</button>
            </div>
            <span class="text-white/50 text-xs font-medium uppercase tracking-wider" x-show="!settingsOpen">
              <span x-text="notifications.length"></span> notification<span x-show="notifications.length !== 1">s</span>
            </span>
            <button v-show="!settingsOpen && notifications.length > 0" @click="confirmAll" style="--wails-draggable: no-drag" class="text-accent-400 hover:text-accent text-xs font-medium transition-colors">Confirm All</button>
          </div>

          <!-- Error banner -->
          <div x-show="apiError" x-cloak class="px-3 py-2 bg-red-500/20 border-b border-red-500/20">
            <span class="text-red-400 text-xs" x-text="apiError"></span>
          </div>

          <!-- Notifications list -->
          <div x-show="!settingsOpen" class="flex-1 overflow-y-auto px-3 py-2 flex flex-col">
            <!-- Notifications take available space -->
            <div class="flex-1">
              <template x-for="(g, index) in groupedNotifications()" :key="g.id + (g.prNumber || '')">
                <div class="notif-enter group relative mb-2 p-3 rounded-xl transition-all duration-150 hover:bg-white/5"
                  :style="{ animationDelay: (index * 0.06) + 's' }">
                  <div class="flex items-start justify-between mb-1">
                    <span class="inline-flex items-center gap-1 flex-wrap">
                      <template x-for="r in g.reasons" :key="r">
                        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase tracking-wider"
                          :class="reasonClass(r)" x-text="reasonLabel(r)"
                        ></span>
                      </template>
                    </span>
                    <span class="text-[11px] text-white/30 whitespace-nowrap ml-2" x-text="timeAgo(g.updated_at)"></span>
                  </div>
                  <div class="text-sm font-medium text-white/90 leading-snug mb-0.5 line-clamp-2" x-text="groupLabel(g)"></div>
                  <div class="text-xs text-white/40 mb-2" x-text="g.repo + (g.prNumber ? ' #' + g.prNumber : '')"></div>
                  <div class="flex gap-2">
                    <button @click="confirm(g.id)" class="flex-1 py-1.5 px-3 rounded-lg bg-white/10 hover:bg-white/20 text-white/80 hover:text-white text-xs font-medium transition-all">Confirm</button>
                    <button @click="window.go.main.App.OpenAndCollapse(g.url, g.id); this.notifications = this.notifications.filter(n => n.id !== g.id); this.unconfirmedCount = Math.max(0, this.unconfirmedCount - 1); this.settingsOpen = false; this.cancelAutoHide(); this.expanded = false" class="flex-1 py-1.5 px-3 rounded-lg bg-accent/20 hover:bg-accent/30 text-accent-400 hover:text-accent text-xs font-medium transition-all">Open</button>
                  </div>
                </div>
              </template>
            </div>

            <!-- Empty state at bottom -->
            <div v-if="notifications.length === 0 && !apiError" class="flex flex-col items-center py-4 text-white/20">
              <template x-if="config.mock_mode">
                <div class="flex flex-col items-center">
                  <span class="text-[11px] mb-0.5">Running in mock mode</span>
                  <span class="text-[9px] text-white/20">Generating fake notifications every 15s</span>
                </div>
              </template>
              <template x-if="!config.mock_mode && !config.github_token">
                <div class="flex flex-col items-center">
                  <span class="text-[11px] mb-0.5">Not configured</span>
                  <span class="text-[9px] text-white/20">Click &#9881; to add your GitHub token</span>
                </div>
              </template>
              <template x-if="!config.mock_mode && config.github_token">
                <span class="text-[11px]">All caught up!</span>
              </template>
            </div>
          </div>

          <!-- Settings panel -->
          <div x-show="settingsOpen" class="flex-1 overflow-y-auto px-4 py-3">
            <h2 class="text-white/80 text-sm font-semibold mb-4">Settings</h2>
            <div class="space-y-3">
              <div>
                <label class="block text-white/50 text-xs mb-1">GitHub Token</label>
                <input type="password" x-model="formToken" placeholder="ghp_..."
                  class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-accent/50 transition-colors placeholder:text-white/20"
                />
              </div>
              <div>
                <label class="block text-white/50 text-xs mb-1">GitHub Username</label>
                <input type="text" x-model="formUsername" placeholder="your-github-username"
                  class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-accent/50 transition-colors placeholder:text-white/20"
                />
              </div>
              <div>
                <label class="block text-white/50 text-xs mb-1">Poll Interval (minutes)</label>
                <input type="number" x-model.number="formInterval" min="1" max="60"
                  class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-accent/50 transition-colors"
                />
              </div>
              <div>
                <label class="block text-white/50 text-xs mb-1.5">Active Days</label>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="day in weekDays" :key="day">
                    <button @click="toggleDay(day)"
                      class="px-2.5 py-1 rounded-lg text-xs font-medium transition-all"
                      :class="formDays.includes(day) ? 'bg-accent/30 text-accent border border-accent/30' : 'bg-white/5 text-white/40 border border-white/10 hover:bg-white/10'"
                      x-text="day.slice(0, 3)"
                    ></button>
                  </template>
                </div>
              </div>
              <div class="flex gap-3">
                <div class="flex-1">
                  <label class="block text-white/50 text-xs mb-1">Start Time</label>
                  <div class="flex gap-1">
                    <input type="number" x-model.number="formStartHour" min="0" max="23" class="w-14 px-2 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-accent/50 transition-colors text-center"/>
                    <span class="text-white/30 self-center text-sm">:</span>
                    <input type="number" x-model.number="formStartMinute" min="0" max="59" class="w-14 px-2 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-accent/50 transition-colors text-center"/>
                  </div>
                </div>
                <div class="flex-1">
                  <label class="block text-white/50 text-xs mb-1">End Time</label>
                  <div class="flex gap-1">
                    <input type="number" x-model.number="formEndHour" min="0" max="23" class="w-14 px-2 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-accent/50 transition-colors text-center"/>
                    <span class="text-white/30 self-center text-sm">:</span>
                    <input type="number" x-model.number="formEndMinute" min="0" max="59" class="w-14 px-2 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-accent/50 transition-colors text-center"/>
                  </div>
                </div>
              </div>
              <div>
                <label class="block text-white/50 text-xs mb-1">Auto-hide (seconds)</label>
                <input type="number" x-model.number="formAutoHide" min="3" max="60" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-accent/50 transition-colors"/>
              </div>
              <div class="flex items-center justify-between py-2">
                <span class="text-white/70 text-sm">Sound on notification</span>
                <button @click="formSound = !formSound" class="w-10 h-5 rounded-full transition-colors relative"
                  :class="formSound ? 'bg-accent' : 'bg-white/20'">
                  <span class="absolute top-0.5 w-4 h-4 rounded-full bg-white transition-all shadow"
                    :class="formSound ? 'left-[22px]' : 'left-0.5'"></span>
                </button>
              </div>
              <div x-show="formSound">
                <label class="block text-white/50 text-xs mb-1">Sound file</label>
                <div class="flex gap-2">
                  <input type="text" x-model="formSoundPath" placeholder="/System/Library/Sounds/Ping.aiff"
                    class="flex-1 px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-accent/50 transition-colors placeholder:text-white/20 font-mono text-[11px] truncate"
                  />
                  <button @click="chooseSoundFile()" class="shrink-0 px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white/70 hover:text-white text-xs font-medium transition-all">Browse</button>
                </div>
              </div>
              <div class="flex items-center justify-between py-2">
                <span class="text-white/70 text-sm">Lock position (disable drag)</span>
                <button @click="formDisableDrag = !formDisableDrag" class="w-10 h-5 rounded-full transition-colors relative"
                  :class="formDisableDrag ? 'bg-accent' : 'bg-white/20'">
                  <span class="absolute top-0.5 w-4 h-4 rounded-full bg-white transition-all shadow"
                    :class="formDisableDrag ? 'left-[22px]' : 'left-0.5'"></span>
                </button>
              </div>
              <div class="flex items-center justify-between py-2">
                <span class="text-white/70 text-sm">Do Not Disturb</span>
                <button @click="formDNDEnabled = !formDNDEnabled" class="w-10 h-5 rounded-full transition-colors relative"
                  :class="formDNDEnabled ? 'bg-indigo-500' : 'bg-white/20'">
                  <span class="absolute top-0.5 w-4 h-4 rounded-full bg-white transition-all shadow"
                    :class="formDNDEnabled ? 'left-[22px]' : 'left-0.5'"></span>
                </button>
              </div>
              <div x-show="formDNDEnabled">
                <label class="block text-white/50 text-xs mb-1">DND duration (hours)</label>
                <select x-model.number="formDNDHours" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-accent/50 transition-colors">
                  <option value="0.5">30 minutes</option>
                  <option value="1">1 hour</option>
                  <option value="2">2 hours</option>
                  <option value="4">4 hours</option>
                  <option value="8">8 hours</option>
                </select>
              </div>
              <div>
                <label class="block text-white/50 text-xs mb-1">Panel opacity: <span class="text-white/70" x-text="Math.round(formPanelOpacity * 100) + '%'"></span></label>
                <input type="range" x-model.number="formPanelOpacity" min="0.3" max="1" step="0.05" class="w-full accent-blue-500"/>
              </div>
              <div>
                <label class="block text-white/50 text-xs mb-1.5">Theme</label>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="t in [{id:'default',label:'Default'},{id:'tokyo-night',label:'Tokyo Night'},{id:'custom',label:'Custom'}]" :key="t.id">
                    <button @click="formTheme = t.id; if(t.id!=='custom') formCustomCSS=''; $nextTick(() => applyTheme())"
                      class="px-2.5 py-1 rounded-lg text-xs font-medium transition-all"
                      :class="formTheme === t.id ? 'bg-accent/30 text-accent border border-accent/30' : 'bg-white/5 text-white/40 border border-white/10 hover:bg-white/10'"
                      x-text="t.label"
                    ></button>
                  </template>
                </div>
              </div>
              <div x-show="formTheme === 'custom'">
                <label class="block text-white/50 text-xs mb-1">Custom CSS variables</label>
                <textarea x-model="formCustomCSS" @input="applyTheme" placeholder=":root { --theme-bg: 40, 40, 40; --theme-accent: #ff6b6b; ... }"
                  class="w-full h-24 px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-xs font-mono focus:outline-none focus:border-accent/50 transition-colors placeholder:text-white/20"
                ></textarea>
              </div>
              <button @click="saveSettings" class="w-full py-2.5 rounded-lg bg-accent hover:bg-white/20 text-white text-sm font-medium transition-all mt-2">Save &amp; Restart Poller</button>
              <button @click="resetPosition" class="w-full py-2 rounded-lg bg-white/5 hover:bg-white/10 text-white/50 hover:text-white/80 text-xs font-medium transition-all mt-1">Reset window position</button>
              <div class="text-center text-[9px] text-white/15 mt-3" x-text="'v' + (version || '?')"></div>
            </div>
          </div>
        </div>
      </template>

    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
